name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z)'
        required: true
permissions:
  contents: read
jobs:
  dashboard-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check the server process power guard
        shell: pwsh
        run: |
          python packaging/build-server-power.py --output native-power/Bathjun-Power.node --assets native-power/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = (Get-Content packaging/windows/runtime-lock.json | ConvertFrom-Json).node
          Invoke-WebRequest $runtime.url -OutFile native-power/node.exe
          if ((Get-FileHash native-power/node.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtime.sha256) { throw "Bundled Node checksum mismatch" }
          & .\native-power\node.exe packaging/windows/tests/check-server-power.mjs native-power/Bathjun-Power.node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: server-power-addon
          path: native-power/Bathjun-Power.node
          retention-days: 7
      - name: Render dashboard with bundled fonts on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-test/bin,native-test/app/public,native-test/screens | Out-Null
          Copy-Item -Recurse public/fonts native-test/app/public/fonts
          Copy-Item -Recurse public/emoji native-test/app/public/emoji
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $compiler /nologo /target:winexe /platform:x64 /warnaserror+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /out:.\native-test\bin\Bathjun-Server.exe .\packaging\windows\DisplayPower.cs .\packaging\windows\ServerPanel.cs .\packaging\windows\Dashboard.cs .\packaging\windows\HumanPresenceReader.cs .\packaging\windows\ServerUpdate.cs .\packaging\windows\AutomaticUpdate.cs .\packaging\windows\TouchScroll.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\DisplayPowerTest.exe .\packaging\windows\tests\DisplayPowerTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\DisplayPowerTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\DashboardTest.exe .\packaging\windows\tests\DashboardTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\packaging\windows\tests\create-dashboard-fixture.mjs .\native-test\fixture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\DashboardTest.exe .\native-test\fixture.json .\native-test\screens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\MemberEntryTest.exe .\packaging\windows\tests\MemberEntryTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\MemberEntryTest.exe .\native-test\screens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /out:.\native-test\bin\UpdateFixture.exe .\packaging\windows\tests\UpdateFixture.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /define:LEGACY_NAME /out:.\native-test\bin\LegacyUpdateFixture.exe .\packaging\windows\tests\UpdateFixture.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\ServerUpdateTest.exe .\packaging\windows\tests\ServerUpdateTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\ServerUpdateTest.exe .\native-test\bin\UpdateFixture.exe .\native-test\screens .\native-test\bin\LegacyUpdateFixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\AutomaticUpdateTest.exe .\packaging\windows\tests\AutomaticUpdateTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\AutomaticUpdateTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  release:
    permissions:
      contents: write
    needs: dashboard-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: server-power-addon
          path: native-power
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis mono-mcs libmono-system-windows-forms4.0-cil libmono-system-web-extensions4.0-cil mono-devel p7zip-full
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check native update package validation
        run: |
          python3 packaging/build-native.py --output /tmp/Bathjun-NativeTests.exe
          mcs -out:/tmp/UpdateFixture.exe packaging/windows/tests/UpdateFixture.cs
          mcs -define:LEGACY_NAME -out:/tmp/LegacyUpdateFixture.exe packaging/windows/tests/UpdateFixture.cs
          mcs -r:/tmp/Bathjun-NativeTests.exe -out:/tmp/ServerUpdateTest.exe packaging/windows/tests/ServerUpdateTest.cs
          mono /tmp/ServerUpdateTest.exe /tmp/UpdateFixture.exe /tmp /tmp/LegacyUpdateFixture.exe
          mcs -r:System.Web.Extensions.dll -r:System.IO.Compression.dll -r:/tmp/Bathjun-NativeTests.exe -out:/tmp/AutomaticUpdateTest.exe packaging/windows/tests/AutomaticUpdateTest.cs
          mono /tmp/AutomaticUpdateTest.exe
      - name: Check version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.RELEASE_TAG!==`v${p.version}`)throw Error("Tag and package version differ");'
      - name: Check Windows release version mapping
        run: python3 packaging/windows/tests/test_release_version.py
      - name: Build both Windows distributions
        run: python3 packaging/build-windows.py --assets /tmp/bathjun-assets --power-addon native-power/Bathjun-Power.node
      - name: Verify installer and portable payloads
        run: |
          python3 packaging/verify-distribution.py dist/Bathjun-Portable-x64.zip
          7z x -y -o/tmp/bathjun-release-installer dist/Bathjun-Setup-x64.exe >/dev/null
          python3 packaging/verify-distribution.py /tmp/bathjun-release-installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "ふろじゅん $RELEASE_TAG" --notes-file docs/release-notes.md --draft
          gh release upload "$RELEASE_TAG" --clobber dist/Bathjun-Setup-x64.exe dist/Bathjun-Setup-x64.exe.sha256 dist/Bathjun-Portable-x64.zip dist/Bathjun-Portable-x64.zip.sha256
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
