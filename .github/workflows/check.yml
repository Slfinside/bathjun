name: Source checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  dashboard-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render dashboard with bundled fonts on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-test/bin,native-test/app/public,native-test/screens | Out-Null
          Copy-Item -Recurse public/fonts native-test/app/public/fonts
          Copy-Item -Recurse public/emoji native-test/app/public/emoji
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $compiler /nologo /target:winexe /platform:x64 /warnaserror+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /out:.\native-test\bin\Bathjun-Server.exe .\packaging\windows\ServerPanel.cs .\packaging\windows\Dashboard.cs .\packaging\windows\HumanPresenceReader.cs .\packaging\windows\ServerUpdate.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\DashboardTest.exe .\packaging\windows\tests\DashboardTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\packaging\windows\tests\create-dashboard-fixture.mjs .\native-test\fixture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\DashboardTest.exe .\native-test\fixture.json .\native-test\screens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:.\native-test\bin\Bathjun-Server.exe /out:.\native-test\bin\MemberEntryTest.exe .\packaging\windows\tests\MemberEntryTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-test\bin\MemberEntryTest.exe .\native-test\screens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep dashboard previews
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashboard-previews
          path: native-test/screens/*.png
          retention-days: 7
